name: Build book
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended texlive-science
      - run: python3 scripts/check-sources.py
      - run: latexmk -r latexmkrc main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: differential-geometry-book
          path: build/main.pdf
          if-no-files-found: error
